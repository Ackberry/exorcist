name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the floor in package.json engines. Windows is here because the
        # build marks dist/cli.js executable without the shell chmod command.
        os: [ubuntu-latest, windows-latest]
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The runner has no Ollama. A scan must still finish from the rules alone.
      - run: node dist/cli.js demo/victim --no-oracle
